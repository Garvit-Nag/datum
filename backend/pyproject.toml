[tool.poetry]
name = "datum-backend"
version = "0.1.0"
description = "Datum — MiniRAG MSA Contract Q&A backend"
authors = ["Garvit Nag"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-jose = { extras = ["cryptography"], version = "^3.3" }
httpx = "^0.27"
pinecone = "^3.2"
sentence-transformers = "^3.0"
pypdf = "^4.3"
supabase = "^2.5"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"
anyio = { extras = ["trio"], version = "^4.4" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
